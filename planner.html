<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Planner</title>
<script src="js/theme.js?v=20261124-themes"></script>
<link rel="stylesheet" href="css/style.css?v=20261124-themes">
<link rel="stylesheet" href="css/supper-club.css?v=20261124-themes">
<link rel="stylesheet" href="css/themes.css?v=20261124-themes">
</head>
<body>

<header class="mp-header">
  <a class="mp-brand" href="index.html">Menu planner</a>
  <nav aria-label="Main navigation">
    <a href="index.html">Plan a meal</a>
    <a href="library.html">Recipe library</a>
    <a href="menus.html">Weekly menus</a>
  </nav>
</header>

<main class="mp-container">

  <div id="mp-planner-warning"></div>

  <div class="mp-page-intro" id="mp-plan-actions">
    <div><h1 id="mp-planner-title">Your plan</h1><p>Make a little room for what you feel like eating.</p></div>
    <div class="mp-plan-action-buttons">
      <button class="mp-btn" id="mp-print-btn">Print Menu</button>
      <button class="mp-btn" id="mp-export-btn">Export Menu</button>
      <button class="mp-btn mp-btn-primary" id="mp-save-plan-btn">Save plan</button>
      <button class="mp-btn" id="mp-save-copy-btn" hidden>Save a copy</button>
      <button class="mp-btn mp-btn-danger" id="mp-start-over-btn">Start Over</button>
    </div>
  </div>

  <div class="mp-planner-grid" id="mp-planner-grid"></div>

</main>

<script src="js/sound.js?v=20261124-themes"></script>

</body>
</html>
